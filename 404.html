<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0f1013">
    <script>
        try {
            if (localStorage.getItem("theme") === "light") {
                document.documentElement.dataset.theme = "light";
            }
        } catch {}
    </script>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/style.css">
    <title>Page not found · Rui Alves</title>
    <style>
        .not-found {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }

        .code {
            margin: 0;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 6px 0 0;
            font-size: clamp(2.25rem, 6vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 1.1;
        }

        .lede {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 1.0625rem;
            line-height: 1.6;
        }

        .home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            padding: 14px 20px;
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 0.975rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
        }

        .home:active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        @media (hover: hover) {
            .home:hover {
                background-color: var(--accent);
                border-color: var(--accent);
                color: var(--on-accent);
                transform: translateY(-2px);
            }
        }

        .home:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width: 720px) and (orientation: portrait) {
            body {
                display: grid;
                padding: 24px;
            }

            .not-found {
                padding: 32px 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .not-found {
                animation: none;
            }

            .home {
                transition: none;
            }

            .home:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" type="button" aria-label="Switch to light theme">
        <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
    <main class="not-found">
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p class="lede">This page does not exist or has moved.</p>
        <a class="home" href="/">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to the home page
        </a>
    </main>
    <script>
        (() => {
            const root = document.documentElement;
            const button = document.querySelector(".theme-toggle");
            const meta = document.querySelector('meta[name="theme-color"]');
            const colors = { dark: "#0f1013", light: "#f3f5f8" };

            function apply(theme) {
                root.dataset.theme = theme;
                meta.setAttribute("content", colors[theme]);
                button.setAttribute("aria-label", `Switch to ${theme === "dark" ? "light" : "dark"} theme`);
            }

            apply(root.dataset.theme === "light" ? "light" : "dark");

            button.addEventListener("click", () => {
                const theme = root.dataset.theme === "light" ? "dark" : "light";
                apply(theme);
                try {
                    localStorage.setItem("theme", theme);
                } catch {}
            });
        })();
    </script>
</body>
</html>
